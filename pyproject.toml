[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sawt"
dynamic = ["version"]
description = "Listen to any web page or book, read aloud by a voice model running on your own machine."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Muneeb Sajjad" }]
keywords = ["text-to-speech", "tts", "read-aloud", "audiobook", "kokoro", "offline", "privacy",
            "accessibility", "epub"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Natural Language :: English",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Adaptive Technologies",
]
requires-python = ">=3.11,<3.15"   # onnxruntime has no wheels outside this range
dependencies = [
  "kokoro-onnx>=0.4",
  # onnxruntime stopped shipping Intel-Mac wheels after 1.23
  "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64'",
  "numpy",
  "soundfile",
  "num2words",
  "tqdm",
  # books only; the read-aloud server does not touch these
  "ebooklib",
  "beautifulsoup4",
  "pypdf",
  "wordfreq",
]

[project.urls]
Homepage = "https://github.com/muneebsajjad/sawt"
Documentation = "https://github.com/muneebsajjad/sawt#readme"
Issues = "https://github.com/muneebsajjad/sawt/issues"
Changelog = "https://github.com/muneebsajjad/sawt/releases"

[project.scripts]
sawt = "sawt.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/sawt/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sawt"]

[tool.hatch.build.targets.sdist]
exclude = ["HANDOFF.md"]
