name: Feature request
description: Suggest an idea
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, the solution second - there may be an easier way.
    validations: {required: true}
  - type: textarea
    id: idea
    attributes:
      label: What would help?
